# FreedroidRPG Android port - initial ARM64 software-rendered build.
# This file is consumed by pelya/commandergenius (SDL 1.2 Android runtime).

AppName="FreedroidRPG"
AppFullName=org.freedroid.rpg
AppVersionCode=10001
AppVersionName="1.0.0-android-dev1"

# The runtime bundles or downloads this ZIP and extracts it into app-private storage.
# AndroidPreBuild.sh creates AndroidData/freedroid-data.zip from the original source tree.
AppDataDownloadUrl="!!FreedroidRPG game data|freedroid-data.zip"
ResetSdlConfigForThisVersion=y
DeleteFilesOnUpgrade=""
ReadmeText='FreedroidRPG Android test build. Touch to move/click; long-press for the secondary mouse button.'

LibSdlVersion=1.2
ScreenOrientation=h
VideoDepthBpp=16
NeedDepthBuffer=n
NeedStencilBuffer=n
NeedGles2=n
NeedGles3=n
UseGl4es=
SwVideoMode=y
SdlVideoResize=y
SdlVideoResizeKeepAspect=y
InhibitSuspend=y
CreateService=
CompatibilityHacksForceScreenUpdate=n
CompatibilityHacksForceScreenUpdateMouseClick=y
CompatibilityHacksStaticInit=y
CompatibilityHacksTextInputEmulatesHwKeyboard=n
CompatibilityHacksPreventAudioChopping=n
CompatibilityHacksAppIgnoresAudioBufferSize=n
CompatibilityHacksAdditionalPreloadedSharedLibraries=""
CompatibilityHacksSlowCompatibleEventQueue=n
CompatibilityHacksTouchscreenKeyboardSaveRestoreOpenGLState=
CompatibilityHacksProperUsageOfSDL_UpdateRects=n

AppUsesMouse=y
AppNeedsTwoButtonMouse=y
RightMouseButtonLongPress=y
ShowMouseCursor=n
ScreenFollowsMouse=
GenerateSubframeTouchEvents=
ForceRelativeMouseMode=n
AppNeedsArrowKeys=y
FloatingScreenJoystick=
AppNeedsTextInput=n
AppUsesJoystick=n
AppUsesSecondJoystick=n
AppUsesThirdJoystick=
AppUsesAccelerometer=n
AppUsesGyroscope=n
AppUsesOrientationSensor=
MoveMouseWithGyroscope=
AppUsesMultitouch=n
AppRecordsAudio=n
AccessSdCard=n
ReadObbFile=n
AccessInternet=n
ImmersiveMode=y
DrawInDisplayCutout=n
HideSystemMousePointer=y
NonBlockingSwapBuffers=n
RedefinedKeys="LALT RETURN NO_REMAP NO_REMAP SPACE DELETE"
AppTouchscreenKeyboardKeysAmount=0
RedefinedKeysScreenGestures="MOUSE_WHEEL_UP MOUSE_WHEEL_DOWN 1 2"
RedefinedKeysScreenKb="LALT RETURN KP_PLUS KP_MINUS SPACE DELETE"
RedefinedKeysScreenKbNames="LALT RETURN KP_PLUS KP_MINUS SPACE DELETE MOUSE_WHEEL_UP MOUSE_WHEEL_DOWN 1 2"
TouchscreenKeysTheme=2
RedefinedKeysGamepad="LALT RETURN KP_PLUS KP_MINUS MOUSE_RIGHT MOUSE_LEFT SPACE MOUSE_RIGHT DELETE MOUSE_LEFT"
RedefinedKeysSecondGamepad=""
RedefinedKeysThirdGamepad=""
RedefinedKeysFourthGamepad=""
StartupMenuButtonTimeout=1500
HiddenMenuOptions='SettingsMenuMouse.DisplaySizeConfig'
FirstStartMenuOptions=''
AppMinimumRAM=0

NDK_TOOLCHAIN_VERSION=clang
APP_PLATFORM=android-24
MultiABI='arm64-v8a'
CompiledLibraries="sdl_image sdl_gfx"
CustomBuildScript=y
AppCflags='-O2 -fno-strict-aliasing'
AppCppflags=''
AppLdflags=''
AppOverlapsSystemHeaders=n
AppSubdirsBuild=''
AppBuildExclude=''
AppCmdline='freedroidRPG'
MinimumScreenSize=m
AdmobPublisherId=n
AdmobTestDeviceId=
AdmobBannerSize=
GooglePlayGameServicesId=
AppOpenFileExtension=''
