# Copy this file to .github/workflows/build-freedroid-android.yml in a repo
# whose root contains this overlay directory as ./freedroid_android_port/.
name: Build FreedroidRPG Android

on:
  push:
    branches:
      - freedroid-android-port
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out the port overlay
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: ''

      - name: Install Android SDK and NDK packages
        shell: bash
        run: |
          # The setup action accepts SDK licenses before installing packages.
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "${ANDROID_HOME}/ndk/27.2.12479018" >> "$GITHUB_PATH"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> "$GITHUB_ENV"

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake gettext autopoint \
            libtool pkg-config zip unzip curl python3 rsync

      - name: Fetch SDL 1.2 Android runtime
        run: |
          git clone --depth 1 --branch sdl_android \
            https://github.com/pelya/commandergenius.git commandergenius
          git -C commandergenius submodule update --init --depth 1 \
            project/jni/sdl2 project/jni/sdl2_image
          git -C commandergenius/project/jni/sdl2_image submodule update --init --depth 1 \
            external/jpeg external/libpng

      - name: Add FreedroidRPG port files and fetch original game source
        shell: bash
        run: |
          APP_DIR="$GITHUB_WORKSPACE/commandergenius/project/jni/application/freedroidrpg"
          mkdir -p "$APP_DIR"
          cp -a "$GITHUB_WORKSPACE/freedroid_android_port/." "$APP_DIR/"
          curl --fail --location --retry 3 \
            https://ftp.osuosl.org/pub/freedroid/freedroidRPG-1.0/freedroidRPG-1.0.tar.gz \
            --output "$RUNNER_TEMP/freedroidRPG-1.0.tar.gz"
          tar -xzf "$RUNNER_TEMP/freedroidRPG-1.0.tar.gz" -C "$APP_DIR"
          SOURCE_DIR=$(find "$APP_DIR" -mindepth 1 -maxdepth 1 -type d -iname 'freedroidrpg-1.0' -print -quit)
          if [ -z "$SOURCE_DIR" ] || [ ! -f "$SOURCE_DIR/configure" ]; then
            echo "Expected FreedroidRPG 1.0 source tree with configure under $APP_DIR." >&2
            find "$APP_DIR" -maxdepth 3 -name configure -print
            exit 1
          fi
          if [ "$SOURCE_DIR" != "$APP_DIR/freedroidRPG-1.0" ]; then
            mv "$SOURCE_DIR" "$APP_DIR/freedroidRPG-1.0"
          fi

      - name: Build ARM64 debug APK
        working-directory: commandergenius
        run: ./build.sh debug freedroidrpg

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: freedroidrpg-android-arm64-debug
          path: commandergenius/project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
